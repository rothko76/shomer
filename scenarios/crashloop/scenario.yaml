# A service that exits at startup because a required env var was dropped from its config.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-crashloop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: lab-crashloop
  labels:
    app: orders-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: busybox:1.36
          env:
            - name: LOG_LEVEL
              value: info
          command:
            - sh
            - -c
            - |
              echo '{"level":"info","msg":"starting orders-api","version":"2.4.1"}'
              echo '{"level":"info","msg":"loading configuration"}'
              if [ -z "$DATABASE_URL" ]; then
                echo '{"level":"fatal","msg":"config error: required environment variable DATABASE_URL is not set"}'
                exit 1
              fi
              sleep infinity
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
